[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touhou"
version = "0.1.0"
description = "用 pygame 做的东方 Project 同人弹幕游戏"
requires-python = ">=3.13"
dependencies = ["pygame-ce>=2.5.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "pyinstaller"]

[project.scripts]
touhou = "touhou.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# 本项目函数/方法/变量用 lowerCamelCase，与 PEP 8 的 snake_case 建议冲突。
# 这不是疏漏，是有意选择，见设计文档 §8.1。
# N999 是同一个冲突在模块层面的表现：文件按其主类命名（spriteSheet.py、
# gameLoop.py），自然不是 snake_case，因此与上面三条一并豁免。
ignore = ["N802", "N803", "N815", "N999"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["touhou"]
# tests/ 的 pytest 函数按惯例不带返回类型注解，不纳入 mypy strict 的检查范围；
# 只检查 src/touhou 包本身。
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让测试无需 pip install -e . 也能 import touhou
pythonpath = ["src"]
# pytest 默认的 python_files 是 test_*.py / *_test.py，而本项目的测试文件
# 按命名规范叫 testVector2.py 这种（test + 类名，无下划线），默认规则收不到。
# 注意函数名不受影响——默认的 python_functions = test* 能匹配 testFoo。
python_files = ["test*.py"]
